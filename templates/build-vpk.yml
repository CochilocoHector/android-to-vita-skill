name: build-vpk
on:
  push:
    branches: [ main ]

jobs:
  vpk:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake
          make -j$(nproc)
      - name: Package
        run: |
          mkdir -p out
          cp build/eboot.bin out/
          cp -r sce_sys out/
          cd out && zip -r ../SettlersHD-v${GITHUB_SHA::7}.vpk .
      - uses: actions/upload-artifact@v4
        with:
          name: Settlers-vpk
          path: "*.vpk"
