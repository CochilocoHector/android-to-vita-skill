# The Settlers HD Vita 运行时配置（ux0:data/settlers/touch.cfg）
# 图形基线
devtype=5          # 每帧钉住 device_type（游戏会重置为 0）
dxtfmt=5           # DXT 格式编号
landtex=1          # 地形使用自解码纹理
dxtcpu=1           # DXT/PVRTC 由 CPU 解码后上传
hookgui=1          # 安装 GUI 钩子（guinamefix 依赖它）
guinamefix=1       # 忽略图集名 _960/_854 后缀
# 探针（正式版建议全 0）
hookgettex=0       # 纹理加载诊断
hookjni=0          # JNI 查找/调用诊断
audio=1            # 音频后端（默认关闭）
